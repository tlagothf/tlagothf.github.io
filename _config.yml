title: "Portfolio"
name: "심해솔"
description: "Java와 AI를 결합해 서비스를 만드는 백엔드·AI 개발자"
url: "https://tlagothf.github.io"
baseurl: ""

# Minimal Mistakes 테마 설정
remote_theme: "mmistakes/minimal-mistakes@4.24.0"
minimal_mistakes_skin: "air"

locale: "ko-KR"
timezone: "Asia/Seoul"

markdown: kramdown

plugins:
  - jekyll-include-cache
  - jekyll-feed
  - jekyll-seo-tag

collections:
  projects:
    output: true
    permalink: /projects/:path/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: single
      author_profile: true
      read_time: true

  - scope:
      path: ""
      type: "projects"
    values:
      layout: single
      author_profile: false
      share: false

  - scope:
      path: ""
    values:
      layout: single
      author_profile: false

author:
  name: "심해솔"
  avatar: "/assets/images/profile.jpg"
  bio: "Java와 AI 모두 가능한 준비된 개발자"
  location: "Seoul, Korea"
  links:
    - label: "GitHub"
      icon: "fab fa-github"
      url: "https://github.com/tlagothf"
    - label: "Email"
      icon: "fas fa-envelope"
      url: "mailto:sunsol33@naver.com"

social:
  type: "Person"
  name: "심해솔"
  links:
    - "https://github.com/tlagothf"

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock
  - node_modules
  - vendor
